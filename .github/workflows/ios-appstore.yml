# Nieuwe versie van de app naar App Store Connect: build, teksten en schermafbeeldingen.
# Alleen met de hand starten ("Run workflow"); dient niet in voor review. Zie ios/fastlane/Fastfile voor de benodigde secrets.
name: iOS naar App Store Connect

on:
  workflow_dispatch:
    inputs:
      versie:
        description: "Versienummer in App Store Connect"
        required: true
        default: "2.0"

concurrency:
  group: ios-appstore
  cancel-in-progress: false

jobs:
  appstore:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios
      - name: Bouwen en klaarzetten
        run: bundle exec fastlane appstore
        env:
          STAX_VERSIE: ${{ inputs.versie }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
